# Local full stack: Postgres + Redis + app (Celery + Daphne in the app container).
# From backend/: docker compose up --build
#
# Requires a .env next to this file with at least:
#   SECRET_KEY, CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
# Do not duplicate keys in .env — Compose uses the first value for ${VAR} interpolation.
#
# Production: build/run the Dockerfile alone with DATABASE_URL + REDIS_URL + Cloudinary, etc.

services:
  db:
    image: postgres:16-alpine
    container_name: skillspot-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillspot}
      POSTGRES_USER: ${POSTGRES_USER:-skillspot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillspot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillspot} -d ${POSTGRES_DB:-skillspot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skillspot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Local DB UI — http://localhost:8080
  # System: PostgreSQL | Server: db | User/Pass/DB: skillspot (compose defaults)
  adminer:
    image: adminer:4
    container_name: skillspot-adminer
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    container_name: skillspot-web
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Service DNS names on the compose network (override localhost URLs from .env)
      DATABASE_URL: postgres://${POSTGRES_USER:-skillspot}:${POSTGRES_PASSWORD:-skillspot}@db:5432/${POSTGRES_DB:-skillspot}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PORT: "8000"
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-1}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-600}
      # Required — empty values fail Django at startup
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?Set CLOUDINARY_CLOUD_NAME in .env}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?Set CLOUDINARY_API_KEY in .env}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?Set CLOUDINARY_API_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
