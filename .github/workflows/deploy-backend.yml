# Build backend image → push GHCR → optional Render deploy hook.
#
# Same pattern as yetbota (content/identity services): path-filtered rebuilds,
# tags = git SHA + latest on main, GITHUB_TOKEN for ghcr.io.
#
# After the first successful push, the package appears under GitHub → Packages.
# For a private repo you can set that package Public so Render can pull without
# registry credentials (optional), or keep it private and add GHCR creds on Render.
#
# Optional GitHub secret (after creating the Render service + deploy hook):
#   RENDER_BACKEND_DEPLOY_HOOK

name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/skillspot-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy
        env:
          RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_BACKEND_DEPLOY_HOOK" ]; then
            echo "RENDER_BACKEND_DEPLOY_HOOK secret not set — image was pushed; skip Render trigger."
            exit 0
          fi
          echo "Triggering Render deploy hook..."
          curl -fsS -X POST "$RENDER_BACKEND_DEPLOY_HOOK"
          echo "Deploy hook accepted."
